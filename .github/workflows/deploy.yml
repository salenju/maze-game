# 构建并通过 GitHub Pages 发布。
#
# 为什么用 Actions 而不是把 dist/ 提交到 gh-pages 分支：
# 构建产物不进版本库，避免每次改代码都产生一大坨 diff，
# 也不会出现「忘记重新构建就推送」导致线上是旧版本的问题。
#
# 前置条件（只需在网页上设置一次）：
#   仓库 Settings → Pages → Build and deployment → Source 选择「GitHub Actions」

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发，便于重新发布而不必空提交
  workflow_dispatch:

# GITHUB_TOKEN 的最小权限：部署 Pages 需要 pages:write 与 id-token:write
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；排队中的旧任务直接取消，避免发布顺序错乱。
# 注意：这里刻意不取消「进行中」的部署，否则可能出现 Pages 处于半更新状态。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 用 npm ci 而非 npm install：严格按 package-lock.json 安装，
      # 保证线上构建与本地验证的依赖完全一致。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 运行单元测试
        run: npm test

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
